<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Formulario de Inspeccion de Moldes</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #e8a020;
    --accent2: #3b82f6;
    --danger: #ef4444;
    --success: #22c55e;
    --text: #e8eaf0;
    --muted: #7a7f9a;
    --marked: #e8a020;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--accent);
  }

  header h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }

  header p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 4px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
  }

  .card-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

  .field { display: flex; flex-direction: column; gap: 6px; }

  .field label {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .field input, .field select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 1rem;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus, .field select:focus { border-color: var(--accent); }

  .field select option { background: var(--surface2); color: var(--text); }

  .sector-btns { display: flex; gap: 12px; }

  .btn-sector {
    flex: 1;
    padding: 14px;
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-sector.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232,160,32,0.08);
  }

  .referencias-container { max-width: 700px; margin: 0 auto 20px; }

  .ref-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .ref-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  .ref-number {
    background: var(--accent);
    color: #000;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .ref-name-input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 4px 0;
    outline: none;
    text-transform: uppercase;
  }

  .ref-name-input::placeholder { color: var(--muted); }
  .ref-name-input:focus { border-bottom-color: var(--accent); }

  .btn-remove-ref {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.2rem;
    padding: 4px;
    transition: color 0.15s;
  }
  .btn-remove-ref:hover { color: var(--danger); }

  .ref-body { padding: 16px 20px; }

  .grid-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .num-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
  }

  .num-cell {
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
    user-select: none;
  }

  .num-cell:hover { border-color: var(--accent); color: var(--text); transform: scale(1.08); }
  .num-cell.marked { background: var(--marked); border-color: var(--marked); color: #000; font-weight: 700; }

  .marked-summary { margin-top: 10px; margin-bottom: 14px; font-size: 0.8rem; color: var(--muted); min-height: 18px; }
  .marked-summary span { color: var(--accent); font-weight: 600; }

  .comentario-area {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 0.9rem;
    padding: 10px 12px;
    outline: none;
    width: 100%;
    min-height: 70px;
    resize: vertical;
    transition: border-color 0.2s;
  }
  .comentario-area::placeholder { color: var(--muted); }
  .comentario-area:focus { border-color: var(--accent); }

  .btn-add-ref {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    max-width: 700px;
    margin: 0 auto 20px;
    padding: 14px;
    background: transparent;
    border: 2px dashed var(--border);
    border-radius: 10px;
    color: var(--accent2);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }

  .btn-add-ref:hover { border-color: var(--accent2); background: rgba(59,130,246,0.06); }
  .btn-add-ref:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-submit {
    display: block;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 16px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #000;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .btn-submit:hover { background: #f5b833; transform: translateY(-1px); }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--success);
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 12px 28px;
    border-radius: 8px;
    transition: transform 0.3s ease;
    z-index: 999;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .num-cell { font-size: 0.65rem; }
    .sector-btns { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <h1>Inspeccion de Moldes</h1>
  <p>Registro de cavidades - O-I Manufacturing</p>
</header>

<!-- Sector -->
<div class="card">
  <div class="card-title">Sector</div>
  <div class="sector-btns">
    <button class="btn-sector active" id="btnLinea" onclick="setSector('LINEA')">Linea</button>
    <button class="btn-sector" id="btnAjustador" onclick="setSector('AJUSTADORES')">Ajustador</button>
  </div>
  <input type="hidden" id="sector" value="LINEA"/>
</div>

<!-- Info general -->
<div class="card">
  <div class="card-title">Datos generales</div>
  <div class="grid-2" style="margin-bottom:14px;">
    <div class="field">
      <label>Fecha</label>
      <input type="date" id="fecha"/>
    </div>
    <div class="field"></div>
  </div>
  <div class="field">
    <label>Nombre</label>
    <select id="nombre">
      <option value="">-- Selecciona tu nombre --</option>
    </select>
  </div>
</div>

<!-- Cantidades -->
<div class="card">
  <div class="card-title">Cantidades</div>
  <div class="grid-3">
    <div class="field">
      <label>Premoldes</label>
      <input type="number" id="premolares" min="0" placeholder="0"/>
    </div>
    <div class="field">
      <label>Moldes</label>
      <input type="number" id="moldes" min="0" placeholder="0"/>
    </div>
    <div class="field">
      <label>DG</label>
      <input type="number" id="dg" min="0" placeholder="0"/>
    </div>
  </div>
</div>

<!-- Referencias -->
<div class="referencias-container" id="refsContainer"></div>

<button class="btn-add-ref" id="btnAgregarRef" onclick="agregarReferencia()">
  + Agregar Referencia
</button>

<button class="btn-submit" id="btnEnviar" onclick="enviarFormulario()">
  Enviar Formulario
</button>

<div id="toast">Formulario enviado correctamente</div>

<script>
  const MAX_REFS = 8;
  let refCount = 0;

  const NOMBRES = {
    LINEA: [
      'John Castaneda',
      'Nelson Mantilla',
      'Luis Miguel'
      'Brayan Garcia'
    ],
    AJUSTADORES: [
      'Jose Malaver',
      'Daniel Cardenas',
      'Ivan Salgado',
      'Leandro',
      'Jose Albino',
      'Alexander Toro',
      'Jose Mancipe',
      'Miguel Cordero',
      'Daniel Olaya'
      
    ]
  };

  // GOOGLE SHEETS WEBHOOK URL
  const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwrSo2-Qb5QtO10vIFQErl0l57SfyZGuKdF1P4LYsqypVHMdlalhVdCcXp0ZKH9fiGs/exec';

  document.getElementById('fecha').valueAsDate = new Date();
  actualizarNombres('LINEA');

  function setSector(valor) {
    document.getElementById('sector').value = valor;
    document.getElementById('btnLinea').classList.toggle('active', valor === 'LINEA');
    document.getElementById('btnAjustador').classList.toggle('active', valor === 'AJUSTADORES');
    actualizarNombres(valor);
  }

  function actualizarNombres(sector) {
    const select = document.getElementById('nombre');
    select.innerHTML = '<option value="">-- Selecciona tu nombre --</option>';
    NOMBRES[sector].forEach(function(nombre) {
      const option = document.createElement('option');
      option.value = nombre;
      option.textContent = nombre;
      select.appendChild(option);
    });
  }

  function agregarReferencia() {
    const totalActual = document.querySelectorAll('.ref-item').length;
    if (totalActual >= MAX_REFS) {
      alert('Maximo 8 referencias por formulario.');
      return;
    }

    refCount++;
    const id = 'ref_' + refCount;
    const container = document.getElementById('refsContainer');

    const div = document.createElement('div');
    div.className = 'ref-item';
    div.id = id;

    div.innerHTML =
      '<div class="ref-header">' +
        '<span class="ref-number">REF ' + (totalActual + 1) + '</span>' +
        '<input class="ref-name-input" type="text" placeholder="Nombre de la referencia (ej: 7677)" id="refName_' + refCount + '"/>' +
        '<button class="btn-remove-ref" onclick="eliminarReferencia(\'' + id + '\')" title="Eliminar">x</button>' +
      '</div>' +
      '<div class="ref-body">' +
        '<div class="grid-label">Selecciona las cavidades defectuosas</div>' +
        '<div class="num-grid" id="grid_' + refCount + '"></div>' +
        '<div class="marked-summary" id="summary_' + refCount + '">Ninguna cavidad marcada</div>' +
        '<div class="grid-label" style="margin-top:4px;">Comentarios</div>' +
        '<textarea class="comentario-area" id="comentario_' + refCount + '" placeholder="Observaciones o detalles de esta referencia..."></textarea>' +
      '</div>';

    container.appendChild(div);

    const grid = document.getElementById('grid_' + refCount);
    for (let i = 1; i <= 120; i++) {
      const cell = document.createElement('div');
      cell.className = 'num-cell';
      cell.textContent = i;
      cell.dataset.num = i;
      (function(c, r) {
        c.onclick = function() { toggleCell(c, r); };
      })(cell, refCount);
      grid.appendChild(cell);
    }

    document.getElementById('btnAgregarRef').disabled = document.querySelectorAll('.ref-item').length >= MAX_REFS;
  }

  function toggleCell(cell, refId) {
    cell.classList.toggle('marked');
    updateSummary(refId);
  }

  function updateSummary(refId) {
    const grid = document.getElementById('grid_' + refId);
    const marked = Array.from(grid.querySelectorAll('.num-cell.marked')).map(function(c) { return c.dataset.num; });
    const summary = document.getElementById('summary_' + refId);
    if (marked.length === 0) {
      summary.innerHTML = 'Ninguna cavidad marcada';
    } else {
      summary.innerHTML = '<span>' + marked.length + ' cavidad' + (marked.length > 1 ? 'es' : '') + ' marcada' + (marked.length > 1 ? 's' : '') + ':</span> ' + marked.join(', ');
    }
  }

  function eliminarReferencia(id) {
    document.getElementById(id).remove();
    document.getElementById('btnAgregarRef').disabled = false;
  }

  function enviarFormulario() {
    const fecha      = document.getElementById('fecha').value;
    const nombre     = document.getElementById('nombre').value;
    const sector     = document.getElementById('sector').value;
    const premolares = document.getElementById('premolares').value;
    const moldes     = document.getElementById('moldes').value;
    const dg         = document.getElementById('dg').value;

    if (!fecha || !nombre) {
      alert('Por favor completa fecha y nombre.');
      return;
    }

    // Deshabilitar botón para evitar doble envío
    const btnEnviar = document.getElementById('btnEnviar');
    btnEnviar.disabled = true;
    btnEnviar.textContent = 'Enviando...';

    const referencias = [];
    document.querySelectorAll('.ref-item').forEach(function(item, idx) {
      const grid = item.querySelector('[id^="grid_"]');
      if (!grid) return;
      const refId = grid.id.replace('grid_', '');
      const nameInput  = document.getElementById('refName_' + refId);
      const comentario = document.getElementById('comentario_' + refId);
      const marked = Array.from(grid.querySelectorAll('.num-cell.marked')).map(function(c) { return parseInt(c.dataset.num); });
      referencias.push({
        nombre:     nameInput  ? (nameInput.value.trim()  || ('Referencia ' + (idx+1))) : ('Referencia ' + (idx+1)),
        cavidades:  marked,
        comentario: comentario ? comentario.value.trim() : ''
      });
    });

    const payload = {
      fecha:     fecha,
      nombre:    nombre,
      sector:    sector,
      premoldes: parseInt(premolares) || 0,
      moldes:    parseInt(moldes) || 0,
      dg:        parseInt(dg) || 0,
      referencias: referencias
    };

    fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      mode: 'no-cors'
    })
    .then(function() {
      mostrarToast();
      resetFormulario();
    })
    .catch(function() {
      alert('Error de conexion, verifica tu internet');
      btnEnviar.disabled = false;
      btnEnviar.textContent = 'Enviar Formulario';
    });
  }

  function resetFormulario() {
    document.getElementById('premolares').value = '';
    document.getElementById('moldes').value = '';
    document.getElementById('dg').value = '';
    document.getElementById('refsContainer').innerHTML = '';
    document.getElementById('fecha').valueAsDate = new Date();
    document.getElementById('btnAgregarRef').disabled = false;
    const btnEnviar = document.getElementById('btnEnviar');
    btnEnviar.disabled = false;
    btnEnviar.textContent = 'Enviar Formulario';
    refCount = 0;
    setSector('LINEA');
  }

  function mostrarToast() {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 3000);
  }
</script>
</body>
</html>
