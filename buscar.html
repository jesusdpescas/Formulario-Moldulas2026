<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Buscador - Inspecciones O-I</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #22263a;
  --border: #2e3350;
  --accent: #e8a020;
  --accent2: #3b82f6;
  --success: #22c55e;
  --danger: #ef4444;
  --text: #e8eaf0;
  --muted: #7a7f9a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; padding: 24px 16px 60px; }

header { text-align: center; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 2px solid var(--accent); }
header h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 2rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
header p { color: var(--muted); font-size: .85rem; margin-top: 4px; letter-spacing: .05em; text-transform: uppercase; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .8rem; text-decoration: none; letter-spacing: .06em; text-transform: uppercase; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; margin-bottom: 16px; transition: color .2s; }
.back-link:hover { color: var(--accent); }

.search-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 800px; margin: 0 auto 24px; }
.search-title { font-family: 'Barlow Condensed', sans-serif; font-size: .75rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.search-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.search-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field input { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'Barlow', sans-serif; font-size: .95rem; padding: 10px 12px; outline: none; transition: border-color .2s; }
.field input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--muted); }

.btn-search { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 8px; color: #000; font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; transition: background .2s; }
.btn-search:hover { background: #f5b833; }
.btn-search:disabled { opacity: .5; cursor: not-allowed; }
.btn-clear { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: .85rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; margin-top: 8px; transition: all .2s; }
.btn-clear:hover { border-color: var(--danger); color: var(--danger); }

.results-area { max-width: 800px; margin: 0 auto; }
.results-header { font-family: 'Barlow Condensed', sans-serif; font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.results-header span { color: var(--accent); }

.result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.result-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.result-fecha { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: .9rem; color: var(--accent); }
.result-nombre { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1rem; color: var(--text); }
.badge { font-family: 'Barlow Condensed', sans-serif; font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .05em; }
.badge-linea { background: rgba(59,130,246,.15); color: var(--accent2); border: 1px solid rgba(59,130,246,.3); }
.badge-ajust { background: rgba(232,160,32,.1); color: var(--accent); border: 1px solid rgba(232,160,32,.3); }
.result-counts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.count-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font-family: 'Barlow Condensed', sans-serif; font-size: .75rem; font-weight: 600; color: var(--muted); }
.count-item strong { color: var(--text); }
.result-refs { display: flex; flex-direction: column; gap: 6px; }
.ref-row { background: var(--surface2); border-radius: 6px; padding: 8px 12px; font-size: .82rem; }
.ref-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; color: var(--accent); letter-spacing: .04em; margin-bottom: 2px; }
.ref-cavs { color: var(--muted); font-size: .78rem; }
.ref-cavs .cav-match { color: var(--success); font-weight: 700; }
.ref-tipo { display: inline-block; font-size: .65rem; font-weight: 700; padding: 1px 6px; border-radius: 3px; background: rgba(232,160,32,.15); color: var(--accent); border: 1px solid rgba(232,160,32,.2); margin-left: 6px; font-family: 'Barlow Condensed', sans-serif; letter-spacing: .05em; }

.no-results { text-align: center; padding: 40px 20px; color: var(--muted); font-size: .9rem; }
.no-results strong { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 1.2rem; color: var(--text); margin-bottom: 8px; letter-spacing: .05em; }

.loading { text-align: center; padding: 40px; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; letter-spacing: .1em; text-transform: uppercase; }
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin-right: 10px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

@media(max-width:480px) { .search-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<a class="back-link" href="https://jesusdpescas.github.io/Formulario-Moldulas2026/">&#8592; Volver al formulario</a>

<header>
  <h1>Buscador de Inspecciones</h1>
  <p>O-I Manufacturing — Consulta de registros</p>
</header>

<div class="search-card">
  <div class="search-title">Filtros de busqueda</div>
  <div class="search-grid" style="grid-template-columns:1fr 1fr;">
    <div class="field">
      <label>Fecha inicial</label>
      <input type="date" id="filtFechaIni"/>
    </div>
    <div class="field">
      <label>Fecha final</label>
      <input type="date" id="filtFechaFin"/>
    </div>
    <div class="field">
      <label>Nombre</label>
      <select id="filtNombre" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Barlow',sans-serif;font-size:.95rem;padding:10px 12px;outline:none;width:100%;">
        <option value="">-- Todos --</option>
        <optgroup label="Linea">
          <option>John Castaneda</option>
          <option>Nelson Mantilla</option>
          <option>Luis Miguel</option>
          <option>Brayan Garcia</option>
          <option>Brayan Vanegas</option>
          <option>Manuel Bello</option>
          <option>Jorge Quintana</option>
          <option>Jeisson Gonzales</option>
        </optgroup>
        <optgroup label="Ajustadores">
          <option>Jose Malaver</option>
          <option>Daniel Cardenas</option>
          <option>Ivan Salgado</option>
          <option>Leandro</option>
          <option>Jose Albino</option>
          <option>Alexander Toro</option>
          <option>Jose Mancipe</option>
          <option>Donny Vargas</option>
          <option>Miguel Cordero</option>
          <option>Daniel Olaya</option>
          <option>Jhonatan Pinzon</option>
        </optgroup>
      </select>
    </div>
    <div class="field">
      <label>Referencia</label>
      <input type="text" id="filtRef" placeholder="Ej: 7677"/>
    </div>
    <div class="field">
      <label>Numero de cavidad</label>
      <input type="number" id="filtCav" placeholder="Ej: 38" min="1" max="120"/>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0;">
    <button class="btn-search" id="btnBuscar" onclick="buscar(false)">Buscar todos</button>
    <button class="btn-search" id="btnUltimo" onclick="buscar(true)" style="background:var(--accent2);color:#fff;">Ver ultimo</button>
  </div>

  <!-- ===================== NUEVO: REPORTE POR RANGO ===================== -->
  <button class="btn-clear" onclick="generarReporte()" type="button" style="margin-top:8px;border-color:var(--accent);color:var(--accent);">Reporte</button>
  <!-- ================== FIN NUEVO ================== -->

  <button class="btn-clear" onclick="limpiar()">Limpiar filtros</button>
</div>

<div class="results-area" id="resultsArea"></div>

<!-- ===================== NUEVO: AREA DE REPORTE/GRAFICAS ===================== -->
<div class="results-area" id="reportArea" style="display:none;">
  <div class="search-card">
    <div class="search-title">Total reparado por trabajador</div>
    <canvas id="chartTrabajadores" height="220"></canvas>
  </div>
  <div class="search-card">
    <div class="search-title">Distribucion por sector</div>
    <canvas id="chartSectores" height="180"></canvas>
  </div>
  <div id="tablaResumen"></div>
</div>
<!-- ================== FIN NUEVO ================== -->

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQ76NOzAAoOTqjlEoSAS8bfynfllCik6trL0ak95gtJvHLGM9HmyKIZFl1B22ZPevk/exec';
function buscar(soloUltimo) {
  var filtFechaIni = document.getElementById('filtFechaIni').value;
  var filtFechaFin = document.getElementById('filtFechaFin').value;
  var filtNombre = document.getElementById('filtNombre').value.trim();
  var filtRef    = document.getElementById('filtRef').value.trim();
  var filtCav    = document.getElementById('filtCav').value.trim();

  document.getElementById('reportArea').style.display = 'none';

  if (!filtFechaIni && !filtFechaFin && !filtNombre && !filtRef && !filtCav) {
    document.getElementById('resultsArea').innerHTML = '<div class="no-results"><strong>Agrega al menos un filtro</strong>Usa fecha, nombre, referencia o numero de cavidad.</div>';
    return;
  }

  document.getElementById('resultsArea').innerHTML = '<div class="loading"><span class="spinner"></span>Buscando...</div>';
  document.getElementById('btnBuscar').disabled = true;
  document.getElementById('btnUltimo').disabled = true;

  var url = SCRIPT_URL + '?accion=buscar&t=' + Date.now();
  if (filtFechaIni) url += '&fechaIni=' + encodeURIComponent(filtFechaIni);
  if (filtFechaFin) url += '&fechaFin=' + encodeURIComponent(filtFechaFin);
  if (filtNombre) url += '&nombre=' + encodeURIComponent(filtNombre);
  if (filtRef)    url += '&ref='    + encodeURIComponent(filtRef);
  if (filtCav)    url += '&cav='    + encodeURIComponent(filtCav);

  fetch(url, {redirect: 'follow'})
    .then(function(r){ return r.json(); })
    .then(function(data) {
      document.getElementById('btnBuscar').disabled = false;
      document.getElementById('btnUltimo').disabled = false;
      var resultados = (data.resultados || []).map(function(r) {
        return {
          fecha: r.fecha, nombre: r.nombre, sector: r.sector,
          pre: r.pre, mol: r.mol, dg: r.dg, gs: r.gs, sei: r.sei, fondos: r.fondos,
          refs: (r.refs || []).map(function(ref) {
            return {
              nombre: ref.nombre,
              cavidades: ref.cavidades ? ref.cavidades.split(',').map(function(x){return x.trim();}) : [],
              tipo: ref.tipo,
              cavMatch: filtCav
            };
          })
        };
      });
      if (soloUltimo && resultados.length > 0) {
        resultados.sort(function(a,b){ return b.fecha.localeCompare(a.fecha); });
        resultados = [resultados[0]];
      }
      mostrarResultados(resultados, filtCav);
    })
    .catch(function() {
      document.getElementById('btnBuscar').disabled = false;
      document.getElementById('btnUltimo').disabled = false;
      document.getElementById('resultsArea').innerHTML = '<div class="no-results"><strong>Error de conexion</strong>No se pudo conectar. Intenta de nuevo.</div>';
    });
}

function mostrarResultados(resultados, filtCav) {
  var area = document.getElementById('resultsArea');
  if (resultados.length === 0) {
    area.innerHTML = '<div class="no-results"><strong>Sin resultados</strong>No se encontraron registros con los filtros aplicados.</div>';
    return;
  }

  var html = '<div class="results-header">Se encontraron <span>' + resultados.length + '</span> registro' + (resultados.length > 1 ? 's' : '') + '</div>';

  resultados.forEach(function(r) {
    var badgeClass = r.sector === 'LINEA' ? 'badge-linea' : 'badge-ajust';
    html += '<div class="result-card">';
    html += '<div class="result-top">';
    html += '<span class="result-fecha">' + r.fecha + '</span>';
    html += '<span class="result-nombre">' + r.nombre + '</span>';
    html += '<span class="badge ' + badgeClass + '">' + r.sector + '</span>';
    html += '</div>';

    html += '<div class="result-counts">';
    if (r.pre && r.pre !== '0') html += '<div class="count-item">PRE <strong>' + r.pre + '</strong></div>';
    if (r.mol && r.mol !== '0') html += '<div class="count-item">MOL <strong>' + r.mol + '</strong></div>';
    if (r.dg && r.dg !== '0') html += '<div class="count-item">DG <strong>' + r.dg + '</strong></div>';
    if (r.gs && r.gs !== '0') html += '<div class="count-item">GS <strong>' + r.gs + '</strong></div>';
    if (r.sei && r.sei !== '0') html += '<div class="count-item">6 1/4 <strong>' + r.sei + '</strong></div>';
    if (r.fondos && r.fondos !== '0') html += '<div class="count-item">FONDOS <strong>' + r.fondos + '</strong></div>';
    html += '</div>';

    if (r.refs.length > 0) {
      html += '<div class="result-refs">';
      r.refs.forEach(function(ref) {
        html += '<div class="ref-row">';
        html += '<div class="ref-name">' + ref.nombre;
        if (ref.tipo) html += '<span class="ref-tipo">' + ref.tipo + '</span>';
        html += '</div>';
        if (ref.cavidades.length > 0 && ref.cavidades[0]) {
          var cavHtml = ref.cavidades.map(function(c) {
            if (filtCav && c === filtCav) return '<span class="cav-match">' + c + '</span>';
            return c;
          }).join(', ');
          html += '<div class="ref-cavs">Cavidades: ' + cavHtml + '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    }

    html += '</div>';
  });

  area.innerHTML = html;
}

function limpiar() {
  document.getElementById('filtFechaIni').value = '';
  document.getElementById('filtFechaFin').value = '';
  document.getElementById('filtNombre').value = '';
  document.getElementById('filtRef').value = '';
  document.getElementById('filtCav').value = '';
  document.getElementById('resultsArea').innerHTML = '';
  document.getElementById('reportArea').style.display = 'none';
}

// Allow Enter key to search
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') buscar();
});

// ===================== NUEVO: REPORTE POR RANGO DE FECHAS =====================
var chartTrab = null, chartSec = null;

function generarReporte() {
  var fechaIni = document.getElementById('filtFechaIni').value;
  var fechaFin = document.getElementById('filtFechaFin').value;

  if (!fechaIni || !fechaFin) {
    alert('Selecciona fecha inicial y fecha final para generar el reporte');
    return;
  }

  document.getElementById('resultsArea').innerHTML = '';
  document.getElementById('reportArea').style.display = 'block';
  document.getElementById('tablaResumen').innerHTML = '<div class="loading"><span class="spinner"></span>Generando reporte...</div>';

  var url = SCRIPT_URL + '?accion=resumen&fechaIni=' + encodeURIComponent(fechaIni) + '&fechaFin=' + encodeURIComponent(fechaFin) + '&t=' + Date.now();

  fetch(url, {redirect: 'follow'})
    .then(function(r){ return r.json(); })
    .then(function(data) {
      var trabajadores = data.trabajadores || [];
      var sectores = data.sectores || {};
      if (trabajadores.length === 0) {
        document.getElementById('tablaResumen').innerHTML = '<div class="no-results"><strong>Sin datos</strong>No hay registros en ese rango de fechas.</div>';
        if (chartTrab) { chartTrab.destroy(); chartTrab = null; }
        if (chartSec) { chartSec.destroy(); chartSec = null; }
        return;
      }
      renderCharts(trabajadores, sectores);
      renderTabla(trabajadores);
    })
    .catch(function() {
      document.getElementById('tablaResumen').innerHTML = '<div class="no-results"><strong>Error de conexion</strong>No se pudo generar el reporte.</div>';
    });
}

function renderCharts(trabajadores, sectores) {
  var ctx1 = document.getElementById('chartTrabajadores').getContext('2d');
  if (chartTrab) chartTrab.destroy();
  chartTrab = new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: trabajadores.map(function(t){ return t.nombre; }),
      datasets: [{
        label: 'Total reparado',
        data: trabajadores.map(function(t){ return t.total; }),
        backgroundColor: trabajadores.map(function(t){ return t.sector === 'LINEA' ? '#3b82f6' : '#e8a020'; })
      }]
    },
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#e8eaf0' }, grid: { color: '#2e3350' } },
        y: { ticks: { color: '#e8eaf0' }, grid: { color: '#2e3350' } }
      }
    }
  });

  var ctx2 = document.getElementById('chartSectores').getContext('2d');
  if (chartSec) chartSec.destroy();
  chartSec = new Chart(ctx2, {
    type: 'pie',
    data: {
      labels: Object.keys(sectores),
      datasets: [{ data: Object.values(sectores), backgroundColor: ['#3b82f6', '#e8a020', '#22c55e'] }]
    },
    options: { plugins: { legend: { labels: { color: '#e8eaf0' } } } }
  });
}

function renderTabla(trabajadores) {
  var html = '<div class="search-card"><div class="search-title">Totales por trabajador</div>';
  trabajadores.forEach(function(t) {
    var badgeClass = t.sector === 'LINEA' ? 'badge-linea' : 'badge-ajust';
    html += '<div class="result-card" style="display:flex;justify-content:space-between;align-items:center;">';
    html += '<div><span class="result-nombre">' + t.nombre + '</span> <span class="badge ' + badgeClass + '">' + t.sector + '</span></div>';
    html += '<span class="count-item">TOTAL <strong>' + t.total + '</strong></span>';
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('tablaResumen').innerHTML = html;
}
// ================== FIN NUEVO ==================
</script>
</body>
</html>
